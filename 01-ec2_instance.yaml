- name: create instances
  hosts: local
  connection: local
  vars:
   ami_id: "ami-0220d79f3f480ecf5" # replace with your AMI ID, you can use the same AMI for all instances as we are going to install the software in the next steps
   sg_id: "sg-031674407f289d035"  # replace with your SG ID
   zone_id: "Z07436271Q3L1R10WFWTQ" # replace with your ID
   domain_name: "chandrahasa.online"
   instances:
   - mongodb
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: t3.micro
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
        Name: "{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output
    
  - name: print ec2-instaces
    ansible.builtin.debug:
     msg: "{{ ec2-outpu }}"  