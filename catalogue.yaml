- name: catalogue configuration
  hosts: catalogue
  become: yes
  tasks:
  - name: disables packages
    ansible.builtin.command: dnf module disable nodejs -y

  - name: enables packages
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs packages
    ansible.builtin.package:
      name: nodejs
      state: present
      
  - name: create roboshop system user
    ansible.builtin.user:
      name: roboshop
      comment: roboshop system user
      system: true
      shell: /sbin/nologin
      home: /app

  - name: create directory
    ansible.builtin.file:
      state: directory
      path: /app

  - name: downlode code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip 
      dest: /tmp/catalogue.zip       

  - name: unzip the code
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: systemd service
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service

  - name: copy mongorepo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repod.d/mongo.repo

  - name: install mongodb client
    ansible.builtin.package:
      name: mongodb-mongosh
      state: present

  - name: connect to mongodb catalogue
    ansible.builtin.command:  mongosh mongodb.daws86s.fun --quiet --eval "db.getMongo().getDBNames(). indexOf('catalogue')"
    register: catalogue_output